# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/notenwart/notenwart"
publish = false

# Exact versions, each the newest that is at least 14 days old (scripts/check-age.py).
[workspace.dependencies]
notenwart-api = { path = "crates/notenwart-api" }
notenwart-app = { path = "crates/notenwart-app" }
notenwart-core = { path = "crates/notenwart-core" }
notenwart-store = { path = "crates/notenwart-store" }
notenwart-tui = { path = "crates/notenwart-tui" }
anyhow = "=1.0.104"
argon2 = "=0.6.0"
axum = { version = "=0.8.9", features = ["multipart"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
base64 = "=0.23.1"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
dotenvy = "=0.15.7"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
hex = "=0.4.3"
http-body-util = "=0.1.5"
lettre = { version = "=0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "ring", "webpki-roots", "smtp-transport", "builder", "hostname"] }
lopdf = "=0.45.0"
mime_guess = "=2.0.5"
object_store = { version = "=0.14.2", features = ["aws"] }
percent-encoding = "=2.3.2"
ratatui = "=0.30.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rust-embed = "=8.13.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "time"] }
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "=1.53.3", features = ["full"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["trace", "compression-gzip", "compression-br"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
utoipa = { version = "=6.0.0", features = ["uuid", "time", "preserve_order", "preserve_path_order"] }
uuid = { version = "=1.28.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Password hashing is far too slow unoptimised; keep it fast in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
