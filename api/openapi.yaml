# SPDX-License-Identifier: MIT
# The API contract of notenwart. MIT-licensed (see api/LICENSE) so that clients under any licence,
# such as a future app-store build, can be generated from it. Keep server-only details out of here.
openapi: 3.1.0
info:
  title: notenwart API
  version: 0.1.0
  description: |
    Sign-in sets an HTTP-only session cookie; every endpoint except `/health` and `/auth/*` needs it and acts on
    the signed-in user's organisation. Requests that change something and carry an `Origin` header must come from
    the server's own origin.

    Roles: **admin** (everything), **librarian** (library and ensembles), **leader** (reads the library, manages
    the ensembles they lead), **member** (sees their own parts). A member sees a part when one of their ensembles
    has the part's work and they play its instrument there – any part number, or the same one – or when a leader
    granted them that part in the ensemble; parts without an instrument (full score, …) are for leaders.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
security:
  - session: []
tags:
  - name: auth
    description: Setup, sign-in and the signed-in user.
  - name: people
    description: The organisation's users (admin).
  - name: ensembles
    description: Ensembles, their members with instruments, and the works they play.
  - name: library
    description: Works, their uploaded source PDFs and the parts split from them.
  - name: system
    description: For admins – what the server is and can do, a test email, and the setup checklist.
  - name: images
    description: The organisation's logo, ensemble logos and symbols, people's pictures.
  - name: recordings
    description: Full and practice recordings of works (audio only).
  - name: guests
    description: Links for substitutes without an account to chosen parts of an ensemble, until a date.
  - name: notifications
    description: What happened for the signed-in user, and how they want to hear about it.
  - name: privacy
    description: What is stored about a person, and the record of deleted people.
  - name: loans
    description: The paper archive's loans – who has borrowed which printed parts.
  - name: catalogue
    description: >-
      The organisation's instrument families and instruments. A new organisation starts with a copy of the built-in
      catalogue, named in the server's language.
paths:
  /health:
    get:
      tags: [system]
      security: []
      operationId: getHealth
      summary: Server and database status
      responses:
        '200':
          description: The server and its database are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The server runs, but the database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'


  /auth/status:
    get:
      tags: [auth]
      security: []
      operationId: getAuthStatus
      summary: Whether the server needs setup, and who is signed in
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'

  /auth/setup:
    post:
      tags: [auth]
      security: []
      operationId: setup
      summary: Create the first admin (only while the server has no users) and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupInput'
      responses:
        '201':
          description: Set up and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'

  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/magic-link:
    post:
      tags: [auth]
      security: []
      operationId: requestMagicLink
      summary: Email a one-time sign-in link
      description: Answers 204 whether or not the address is known, so it cannot be used to probe for accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '204':
          description: If the address belongs to a user, a link is on its way (valid for 20 minutes).
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/token:
    post:
      tags: [auth]
      security: []
      operationId: redeemToken
      summary: Sign in with a one-time token from a sign-in or invitation link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Signed in; the token is used up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      responses:
        '204':
          description: Signed out.

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [auth]
      operationId: updateMe
      summary: Change own name or password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'

  /ensembles/{ensembleId}/programs:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
    post:
      tags: [ensembles]
      operationId: createProgram
      summary: Create a programme, e.g. a concert (admin, librarian, leaders of the ensemble)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramInput'
      responses:
        '201':
          description: Created, without works.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /programs/{programId}:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    put:
      tags: [ensembles]
      operationId: updateProgram
      summary: Rename or re-date a programme (admin, librarian, leaders of the ensemble)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [ensembles]
      operationId: deleteProgram
      summary: Delete a programme (the works stay with the ensemble)
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /programs/{programId}/items:
    parameters:
      - $ref: '#/components/parameters/ProgramId'
    put:
      tags: [ensembles]
      operationId: setProgramItems
      summary: Set the works and breaks of a programme in playing order (admin, librarian, leaders of the ensemble)
      description: Works the ensemble does not have yet are given to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/ProgramItem'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /ensembles/{ensembleId}/parts:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
    get:
      tags: [ensembles]
      operationId: listEnsembleParts
      summary: The parts of the ensemble's works, for granting (admin, librarian, leaders of the ensemble)
      responses:
        '200':
          description: Parts by work title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnsemblePart'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /ensembles/{ensembleId}/grants:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
    get:
      tags: [ensembles]
      operationId: listGrants
      summary: Parts granted to single members of the ensemble (admin, librarian, leaders of the ensemble)
      responses:
        '200':
          description: Grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /ensembles/{ensembleId}/grants/{partId}/{userId}:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
      - $ref: '#/components/parameters/PartId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [ensembles]
      operationId: grantPart
      summary: Let one member see one part of an ensemble's work (admin, librarian, leaders of the ensemble)
      responses:
        '204':
          description: Granted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [ensembles]
      operationId: revokePart
      summary: Take a granted part back
      responses:
        '204':
          description: Revoked.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /my/music:
    get:
      tags: [ensembles]
      operationId: getMyMusic
      summary: The parts the signed-in user may see, by ensemble and work
      responses:
        '200':
          description: One entry per ensemble the user belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyEnsemble'

  /users:
    get:
      tags: [people]
      operationId: listUsers
      summary: Users of the organisation (admin, librarian, leader; email only for admins)
      responses:
        '200':
          description: Users ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [people]
      operationId: createUser
      summary: Add a user and create an invitation link (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Created; the link is also emailed when the server can send mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'

  /users/import:
    post:
      tags: [people]
      operationId: importUsers
      summary: Import people from a table (admin)
      description: |
        Each row adds a person (or finds an existing one by email) and optionally puts them in an ensemble, playing an
        instrument and part number. Missing ensembles are created. Nothing is changed when any row has an error: the
        answer is then 422 with the results per row. With `dryRun`, nothing is changed either, and the answer is 200.
        New people get an invitation link (emailed when the server can send mail).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportInput'
      responses:
        '200':
          description: Checked (dry run) or imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: At least one row has an error; nothing was imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'

  /users/bulk:
    post:
      tags: [people]
      operationId: bulkUsers
      summary: Do one thing to many people at once (admin)
      description: |
        One transaction. Changing the role of or deleting yourself is skipped and reported, as are ids that are
        not people of the organisation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkInput'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [people]
      operationId: updateUser
      summary: Change a user's name, email or role (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [people]
      operationId: deleteUser
      summary: Delete a user (admin; not yourself)
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The person has borrowed printed parts that are not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}/invitation:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [people]
      operationId: inviteUser
      summary: Create a new invitation link for a user (admin); older links stop working
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /ensembles:
    get:
      tags: [ensembles]
      operationId: listEnsembles
      summary: Ensembles – all for admins and librarians, otherwise the user's own
      responses:
        '200':
          description: Ensembles ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ensemble'
    post:
      tags: [ensembles]
      operationId: createEnsemble
      summary: Create an ensemble (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsembleInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ensemble'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'

  /ensembles/{ensembleId}:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
    get:
      tags: [ensembles]
      operationId: getEnsemble
      summary: An ensemble with members and works
      description: Members other than the user themself are only listed for those who manage the ensemble.
      responses:
        '200':
          description: The ensemble.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnsembleDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ensembles]
      operationId: updateEnsemble
      summary: Rename an ensemble (admin, librarian, its leaders)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsembleInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ensemble'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [ensembles]
      operationId: deleteEnsemble
      summary: Delete an ensemble (admin, librarian); works and users stay
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /ensembles/{ensembleId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [ensembles]
      operationId: putEnsembleMember
      summary: Add or change a member (admin, librarian, leaders of the ensemble)
      description: Only admins and librarians may make someone a leader, and only users with the role leader or higher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsembleMemberInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnsembleMember'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [ensembles]
      operationId: deleteEnsembleMember
      summary: Remove a member (admin, librarian, leaders of the ensemble)
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /ensembles/{ensembleId}/works/{workId}:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
      - $ref: '#/components/parameters/WorkId'
    put:
      tags: [ensembles]
      operationId: addEnsembleWork
      summary: Give a work to an ensemble (admin, librarian, leaders of the ensemble)
      responses:
        '204':
          description: The ensemble has the work.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ensembles]
      operationId: removeEnsembleWork
      summary: Take a work from an ensemble (admin, librarian, leaders of the ensemble)
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /instruments:
    get:
      tags: [catalogue]
      operationId: listInstruments
      summary: The organisation's instruments (any signed-in user)
      responses:
        '200':
          description: All instruments, ordered by family, then by their order within it.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Instrument'
    post:
      tags: [catalogue]
      operationId: createInstrument
      summary: Add an instrument (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'

  /instruments/{instrumentId}:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    put:
      tags: [catalogue]
      operationId: updateInstrument
      summary: Rename, regroup or reorder an instrument (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [catalogue]
      operationId: deleteInstrument
      summary: Remove an instrument that no part or member uses (admin, librarian)
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /instruments/{instrumentId}/merge:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    post:
      tags: [catalogue]
      operationId: mergeInstrument
      summary: Fold an instrument into another (admin, librarian)
      description: >-
        Parts, members' assignments and recordings move to `into`; the instrument's name and other names become other
        names of `into`; the instrument is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into]
              properties:
                into:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The instrument that stays.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instrument'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /instrument-families:
    get:
      tags: [catalogue]
      operationId: listInstrumentFamilies
      summary: The organisation's instrument families (any signed-in user)
      responses:
        '200':
          description: All families in their order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstrumentFamily'
    post:
      tags: [catalogue]
      operationId: createInstrumentFamily
      summary: Add a family (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentFamilyInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentFamily'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'

  /instrument-families/{familyId}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    put:
      tags: [catalogue]
      operationId: updateInstrumentFamily
      summary: Rename or reorder a family (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstrumentFamilyInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentFamily'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [catalogue]
      operationId: deleteInstrumentFamily
      summary: Remove a family without instruments (admin, librarian)
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /tags:
    get:
      tags: [library]
      operationId: listTags
      summary: All tags used on works, for filters
      responses:
        '200':
          description: Tags in alphabetical order.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /recognize:
    post:
      tags: [library]
      operationId: recognize
      summary: Read title, composer, part … from the first page of a PDF (admin, librarian)
      description: >-
        Nothing is stored. The PDF's own text is read, scans go through OCR, and an external AI also reads the page
        if the operator set one up. Every field is a suggestion and may be missing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: What was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recognition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'

  /loans:
    get:
      tags: [loans]
      operationId: listLoans
      summary: Loans of the organisation (admin, librarian)
      parameters:
        - name: show
          in: query
          schema:
            type: string
            enum: [open, all]
          description: '`open` (default) leaves out returned loans.'
      responses:
        '200':
          description: Open loans first, the longest out on top.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Loan'
        '403':
          $ref: '#/components/responses/Forbidden'

  /loans/{loanId}:
    parameters:
      - name: loanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [loans]
      operationId: updateLoan
      summary: Change a loan, e.g. mark it returned (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [loans]
      operationId: deleteLoan
      summary: Delete a loan entered by mistake (admin, librarian)
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /works/{workId}/loans:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      tags: [loans]
      operationId: listWorkLoans
      summary: Loans of one work, returned ones included (admin, librarian)
      responses:
        '200':
          description: Open loans first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Loan'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [loans]
      operationId: createLoan
      summary: Lend printed parts of a work (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /me/loans:
    get:
      tags: [loans]
      operationId: myLoans
      summary: What the signed-in user has borrowed and not returned (anyone)
      responses:
        '200':
          description: Open loans.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Loan'

  /borrowers:
    get:
      tags: [loans]
      operationId: listBorrowers
      summary: Names of the organisation's people, for choosing a borrower (admin, librarian)
      responses:
        '200':
          description: By name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Borrower'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/sso/start:
    get:
      tags: [auth]
      security: []
      operationId: startSso
      summary: Begin signing in through the organisation's identity provider (a browser navigation)
      parameters:
        - name: next
          in: query
          schema:
            type: string
          description: Path to return to afterwards; only paths of this site.
      responses:
        '302':
          description: To the provider (OpenID Connect, authorization code with PKCE).
        '404':
          description: No identity provider is set up.

  /auth/sso/callback:
    get:
      tags: [auth]
      security: []
      operationId: finishSso
      summary: Where the identity provider sends the browser back
      description: >-
        Only people who exist in notenwart get in, found by the email address the provider vouches for. Failures
        redirect to `/login?sso=unknown` (not known here) or `/login?sso=failed`.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302':
          description: Signed in (session cookie set) and on to `next`, or back to the sign-in page.
        '404':
          description: No identity provider is set up.

  /system:
    get:
      tags: [system]
      operationId: getSystem
      summary: The server's version, settings, abilities, size and the setup checklist (admin)
      responses:
        '200':
          description: The system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
        '403':
          $ref: '#/components/responses/Forbidden'

  /system/test-mail:
    post:
      tags: [system]
      operationId: sendTestMail
      summary: Send a test email to oneself (admin)
      responses:
        '200':
          description: Whether the SMTP server took it.
          content:
            application/json:
              schema:
                type: object
                required: [sent, to]
                properties:
                  sent:
                    type: boolean
                  to:
                    type: string
        '409':
          description: The server sends no email.

  /system/checklist/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          enum: [instruments, backups, testMail]
    put:
      tags: [system]
      operationId: tickSetupStep
      summary: Tick or untick a setup step that is not recognised by itself (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done:
                  type: boolean
      responses:
        '204':
          description: Saved.
        '422':
          $ref: '#/components/responses/Invalid'

  /images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [images]
      security: []
      operationId: getImage
      summary: An avatar image (the organisation's logo for anyone; others for signed-in people allowed to see them)
      responses:
        '200':
          description: The image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /organization:
    get:
      tags: [images]
      operationId: getOrganization
      summary: The organisation (anyone signed in)
      responses:
        '200':
          description: Name, logo and settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    put:
      tags: [images]
      operationId: updateOrganization
      summary: Rename the organisation, allow or forbid profile pictures (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, profilePictures]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                profilePictures:
                  type: boolean
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organization/logo:
    put:
      tags: [images]
      operationId: setOrganizationLogo
      summary: Set the organisation's logo (admin)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP, at most 2 MB.
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [images]
      operationId: removeOrganizationLogo
      summary: Remove the organisation's logo (admin)
      responses:
        '204':
          description: Removed.

  /ensembles/{ensembleId}/logo:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
    put:
      tags: [images]
      operationId: setEnsembleLogo
      summary: Set an ensemble's logo (admin, librarian, leaders of the ensemble)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP, at most 2 MB.
      responses:
        '204':
          description: Saved.
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [images]
      operationId: removeEnsembleLogo
      summary: Remove an ensemble's logo (admin, librarian, leaders of the ensemble)
      responses:
        '204':
          description: Removed.

  /ensembles/{ensembleId}/symbol:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
    put:
      tags: [images]
      operationId: setEnsembleSymbol
      summary: Set an ensemble's symbol and colour (admin, librarian, leaders of the ensemble)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: [string, 'null']
                  description: One emoji or up to four characters; null for initials.
                color:
                  type: [string, 'null']
                  pattern: '^#[0-9a-fA-F]{6}$'
      responses:
        '204':
          description: Saved.
        '422':
          $ref: '#/components/responses/Invalid'

  /me/avatar:
    put:
      tags: [images]
      operationId: setMyAvatar
      summary: Set one's own picture (anyone, if the organisation allows pictures)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP, at most 2 MB.
      responses:
        '204':
          description: Saved.
        '409':
          description: The organisation has switched profile pictures off.
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [images]
      operationId: removeMyAvatar
      summary: Remove one's own picture (anyone)
      responses:
        '204':
          description: Removed.

  /works/{workId}/recordings:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      tags: [recordings]
      operationId: listRecordings
      summary: Recordings of a work (whoever sees a part of it)
      responses:
        '200':
          description: Full recordings first, then practice recordings, by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recording'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [recordings]
      operationId: uploadRecording
      summary: Add a recording (admin, librarian, leaders of an ensemble with the work)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, meta]
              properties:
                file:
                  type: string
                  format: binary
                  description: MP3, AAC/M4A, WAV, FLAC, Ogg, Opus, WebM audio or AIFF; no video.
                meta:
                  type: string
                  description: RecordingInput as JSON.
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Larger than the server allows.
        '422':
          $ref: '#/components/responses/Invalid'

  /recordings/{recordingId}:
    parameters:
      - name: recordingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [recordings]
      operationId: updateRecording
      summary: Change what a recording is (admin, librarian, leaders of an ensemble with the work)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [recordings]
      operationId: deleteRecording
      summary: Delete a recording (admin, librarian, leaders of an ensemble with the work)
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /recordings/{recordingId}/file:
    parameters:
      - name: recordingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [recordings]
      operationId: recordingFile
      summary: The audio (whoever sees a part of the work); supports Range requests
      parameters:
        - name: Range
          in: header
          schema:
            type: string
          description: One byte range, e.g. `bytes=0-`.
      responses:
        '200':
          description: The whole file.
          content:
            audio/*:
              schema:
                type: string
                format: binary
        '206':
          description: The requested range.
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: The range cannot be served.

  /ensembles/{ensembleId}/guest-links:
    parameters:
      - $ref: '#/components/parameters/EnsembleId'
    get:
      tags: [guests]
      operationId: listGuestLinks
      summary: Guest links of an ensemble (admin, librarian, leaders of the ensemble)
      responses:
        '200':
          description: Active first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuestLink'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [guests]
      operationId: createGuestLink
      summary: Make a guest link (admin, librarian, leaders of the ensemble)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, partIds, expiresOn]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Who it is for, e.g. "Max, trumpet substitute".
                partIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                    format: uuid
                  description: Parts of the ensemble's works.
                expiresOn:
                  type: string
                  format: date
                  description: The last day it works; within a year.
      responses:
        '201':
          description: Created; `url` is shown this once (only its hash is stored).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestLink'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'

  /guest-links/{linkId}:
    parameters:
      - name: linkId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [guests]
      operationId: revokeGuestLink
      summary: Stop a guest link (admin, librarian, leaders of the ensemble)
      responses:
        '204':
          description: It no longer works.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /guest/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [guests]
      security: []
      operationId: openGuestLink
      summary: What a guest link shows (no account)
      responses:
        '200':
          description: The guest's parts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestView'
        '404':
          description: Unknown, expired or revoked (indistinguishable).

  /guest/{token}/parts/{partId}/file:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [guests]
      security: []
      operationId: guestPartFile
      summary: A part's PDF through a guest link (no account)
      responses:
        '200':
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The signed-in user's notifications in the app (anyone)
      parameters:
        - name: count
          in: query
          schema:
            type: boolean
          description: Only the number of unread ones (for the bell).
      responses:
        '200':
          description: Newest first, at most 100.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'

  /notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: Mark notifications read (anyone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: [array, 'null']
                  description: These; all when missing.
                  items:
                    type: string
                    format: uuid
      responses:
        '204':
          description: Done.

  /notifications/settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: How the signed-in user hears about each kind (anyone)
      responses:
        '200':
          description: One setting per kind that concerns the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationSetting'
    put:
      tags: [notifications]
      operationId: saveNotificationSettings
      summary: Change how the signed-in user hears about some kinds (anyone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NotificationSetting'
      responses:
        '200':
          description: All settings after the change.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationSetting'

  /me/export:
    get:
      tags: [privacy]
      operationId: exportMyData
      summary: Everything stored about the signed-in user (anyone; GDPR art. 15 and 20)
      responses:
        '200':
          description: Account, ensembles, single parts, annotations, loans and sign-ins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalData'

  /users/{userId}/export:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [privacy]
      operationId: exportUserData
      summary: Everything stored about a person (admin)
      responses:
        '200':
          description: As /me/export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /deletions:
    get:
      tags: [privacy]
      operationId: listDeletions
      summary: Record of deleted people, without their data (admin)
      responses:
        '200':
          description: Newest first, at most 1000.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deletion'
        '403':
          $ref: '#/components/responses/Forbidden'

  /works/facets:
    get:
      tags: [library]
      operationId: getWorkFacets
      summary: Values already used on works, for suggestions while typing (anyone who reads the library)
      responses:
        '200':
          description: Each list is ordered by how often the value is used, then alphabetically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkFacets'
        '403':
          $ref: '#/components/responses/Forbidden'

  /works:
    get:
      tags: [library]
      operationId: listWorks
      summary: List and search works (admin, librarian, leader)
      parameters:
        - name: q
          in: query
          description: Matches title, composer and arranger (case-insensitive, substring).
          schema:
            type: string
        - name: tag
          in: query
          description: Only works with this tag.
          schema:
            type: string
      responses:
        '200':
          description: Works ordered by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkSummary'
    post:
      tags: [library]
      operationId: createWork
      summary: Create a work (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '422':
          $ref: '#/components/responses/Invalid'

  /works/{workId}:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    get:
      tags: [library]
      operationId: getWork
      summary: A work with its source files and parts (admin, librarian, leader)
      responses:
        '200':
          description: The work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [library]
      operationId: updateWork
      summary: Replace a work's metadata (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [library]
      operationId: deleteWork
      summary: Delete a work with all its files and parts (admin, librarian)
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /works/{workId}/sources:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      tags: [library]
      operationId: uploadSource
      summary: Upload a PDF to a work (admin, librarian)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: One PDF. The server's upload limit applies (413 when exceeded).
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceFile'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The same file (by SHA-256) is already part of this work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is larger than the server allows.
        '422':
          $ref: '#/components/responses/Invalid'

  /sources/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    delete:
      tags: [library]
      operationId: deleteSource
      summary: Delete a source file and every part split from it (admin, librarian)
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /sources/{sourceId}/recognize:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      tags: [library]
      operationId: recognizeSource
      summary: Read title, composer, part … from the first page of a stored file (admin, librarian)
      responses:
        '200':
          description: What was found; nothing is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recognition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sources/{sourceId}/split:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    post:
      tags: [library]
      operationId: splitSource
      summary: Propose the parts of a file with several, from each page's header (admin, librarian)
      description: >-
        Reads the top of every page (text, or OCR for scans; at most 400 pages). A page naming an instrument starts a
        part unless it repeats the previous one; pages without a header continue the current part. Nothing is
        created.
      responses:
        '200':
          description: Proposed parts in page order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartProposal'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /sources/{sourceId}/file:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [library]
      operationId: getSourceFile
      summary: The uploaded PDF (admin, librarian, leader)
      responses:
        '200':
          description: The PDF as uploaded.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /works/{workId}/parts:
    parameters:
      - $ref: '#/components/parameters/WorkId'
    post:
      tags: [library]
      operationId: createPart
      summary: Split a part from a source file (admin, librarian)
      description: The server extracts the given pages into the part's own PDF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartInput'
      responses:
        '201':
          description: Created and rendered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /parts/{partId}:
    parameters:
      - $ref: '#/components/parameters/PartId'
    put:
      tags: [library]
      operationId: updatePart
      summary: Change a part, rendering its PDF again (admin, librarian)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Part'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
    delete:
      tags: [library]
      operationId: deletePart
      summary: Delete a part (admin, librarian)
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /parts/{partId}/info:
    parameters:
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [library]
      operationId: getPartInfo
      summary: What the viewer shows about a part (anyone who may see the part)
      responses:
        '200':
          description: The part.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartInfo'
        '404':
          $ref: '#/components/responses/NotFound'

  /parts/{partId}/shared-annotations:
    parameters:
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [library]
      operationId: getSharedAnnotations
      summary: Markings leaders share on a part, one layer per ensemble (whoever sees the part)
      description: >-
        The layers of the user's ensembles that have the work (staff: all such ensembles); empty layers only where
        the user may start one.
      responses:
        '200':
          description: By ensemble name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SharedAnnotations'
        '404':
          $ref: '#/components/responses/NotFound'

  /parts/{partId}/shared-annotations/{ensembleId}:
    parameters:
      - $ref: '#/components/parameters/PartId'
      - $ref: '#/components/parameters/EnsembleId'
    put:
      tags: [library]
      operationId: saveSharedAnnotations
      summary: Replace an ensemble's shared markings on a part (leaders of the ensemble, admin, librarian)
      description: Players are notified of changes at most twice an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationsInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedAnnotations'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /parts/{partId}/annotated:
    parameters:
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [library]
      operationId: annotatedPartFile
      summary: The part's PDF with annotations drawn in, for printing or keeping (whoever sees the part)
      parameters:
        - name: own
          in: query
          schema:
            type: boolean
            default: true
          description: Include the user's own annotations.
        - name: shared
          in: query
          schema:
            type: boolean
            default: true
          description: Include the leaders' shared markings (beneath one's own).
      responses:
        '200':
          description: A copy with the strokes as vector paths; the stored PDF is not changed.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /parts/{partId}/annotations:
    parameters:
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [library]
      operationId: getAnnotations
      summary: The signed-in user's annotations on a part (anyone who may see the part)
      responses:
        '200':
          description: Annotations; empty pages and a null `updatedAt` when there are none yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotations'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [library]
      operationId: putAnnotations
      summary: Replace the signed-in user's annotations on a part
      description: The last write wins – a device that edited offline sends its whole set when it is back online.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationsInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotations'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'

  /parts/{partId}/file:
    parameters:
      - $ref: '#/components/parameters/PartId'
    get:
      tags: [library]
      operationId: getPartFile
      summary: The part's PDF (anyone who may see the part)
      responses:
        '200':
          description: The extracted pages.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: notenwart_session

  parameters:
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FamilyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnsembleId:
      name: ensembleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkId:
      name: workId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartId:
      name: partId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Not signed in, or the credentials or token are wrong or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Signed in, but the role does not allow this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Clashes with existing data, e.g. a name or email that is taken.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many attempts; try again later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such object in this organisation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: The request is well-formed but its content is not acceptable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Health:
      type: object
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Server version (semver).
        database:
          type: string
          enum: [ok, unavailable]

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code, e.g. `unauthorized`, `forbidden`, `not_found`, `invalid`, `conflict`.
        message:
          type: string
          description: Human-readable explanation (English).

    Role:
      type: string
      enum: [admin, librarian, leader, member]

    Me:
      type: object
      required: [id, name, email, role, hasPassword, organization]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        hasPassword:
          type: boolean
          description: False after an invitation until the user sets a password.
        avatarUrl:
          type: [string, 'null']
          description: Path of the user's picture, if any (and allowed).
        organization:
          type: object
          required: [id, name, profilePictures]
          properties:
            logoUrl:
              type: [string, 'null']
            profilePictures:
              type: boolean
              description: People may show a picture.
            id:
              type: string
              format: uuid
            name:
              type: string

    MeInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: [string, 'null']
          minLength: 10
          description: New password; null keeps the current one.
        currentPassword:
          type: [string, 'null']
          description: Required to change an existing password.

    AuthStatus:
      type: object
      required: [setupRequired, mailEnabled, maxUploadBytes, recognition]
      properties:
        setupRequired:
          type: boolean
          description: The server has no users yet; `/auth/setup` creates the first admin.
        mailEnabled:
          type: boolean
          description: The server can send email (sign-in links, invitations).
        maxUploadBytes:
          type: integer
          description: Largest PDF the server accepts in one upload.
        recognition:
          $ref: '#/components/schemas/RecognitionAbilities'
        sso:
          type: [string, 'null']
          description: Name of the identity provider to sign in with (`/auth/sso/start`), if one is set up.
        organization:
          type: [object, 'null']
          description: The organisation's name and logo, for the sign-in page.
          required: [name]
          properties:
            name:
              type: string
            logoUrl:
              type: [string, 'null']
        user:
          oneOf:
            - $ref: '#/components/schemas/Me'
            - type: 'null'

    SetupInput:
      type: object
      required: [organizationName, name, email, password]
      properties:
        organizationName:
          type: string
          minLength: 1
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
        password:
          type: string
          minLength: 10

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, name, role, hasPassword]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, 'null']
          description: Only for admins.
        role:
          $ref: '#/components/schemas/Role'
        hasPassword:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        avatarUrl:
          type: [string, 'null']
        ensembles:
          type: [array, 'null']
          description: The ensembles the person is in (only for admins).
          items:
            $ref: '#/components/schemas/EnsembleRef'

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    ImportRow:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: [string, 'null']
          description: admin, librarian, leader or member (also German – Admin, Notenverwaltung, Leitung, Mitglied); empty means member. Ignored for existing people.
        ensemble:
          type: [string, 'null']
          description: Ensemble name; created when missing.
        instrument:
          type: [string, 'null']
          description: Instrument name or alias (English or German, e.g. "Trompete"); needs an ensemble.
        voice:
          type: [integer, 'null']
          minimum: 1
          description: Part number; empty plays every part of the instrument.

    ImportInput:
      type: object
      required: [rows, dryRun]
      properties:
        rows:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ImportRow'
        dryRun:
          type: boolean

    ImportRowResult:
      type: object
      required: [line, outcome]
      properties:
        line:
          type: integer
          description: Position in `rows`, starting at 1.
        outcome:
          type: string
          enum: [new, existing, error]
        message:
          type: [string, 'null']
          description: Why the row cannot be imported (English).
        invitationUrl:
          type: [string, 'null']
          description: For new people after a real import.

    ImportResult:
      type: object
      required: [applied, rows, newPeople, ensemblesCreated, errors]
      properties:
        applied:
          type: boolean
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowResult'
        newPeople:
          type: integer
        ensemblesCreated:
          type: array
          items:
            type: string
        errors:
          type: integer

    EnsembleRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    BulkInput:
      type: object
      required: [userIds, action]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: string
            format: uuid
        action:
          type: string
          enum: [setRole, addToEnsemble, removeFromEnsemble, invite, delete]
        role:
          $ref: '#/components/schemas/Role'
        ensembleId:
          type: [string, 'null']
          format: uuid
          description: For addToEnsemble and removeFromEnsemble.
        instrumentId:
          type: [string, 'null']
          format: uuid
          description: For addToEnsemble – also play this instrument there.
        voice:
          type: [integer, 'null']
          minimum: 1

    BulkResult:
      type: object
      required: [done, skipped, invitations]
      properties:
        done:
          type: integer
          description: People the action was applied to.
        skipped:
          type: array
          items:
            type: object
            required: [userId, reason]
            properties:
              userId:
                type: string
                format: uuid
              reason:
                type: string
        invitations:
          type: array
          description: New invitation links (action invite).
          items:
            type: object
            required: [userId, name, email, url]
            properties:
              userId:
                type: string
                format: uuid
              name:
                type: string
              email:
                type: string
              url:
                type: string

    Invitation:
      type: object
      required: [user, url, expiresAt, emailed]
      properties:
        user:
          $ref: '#/components/schemas/User'
        url:
          type: string
          description: One-time sign-in link to hand over.
        expiresAt:
          type: string
          format: date-time
        emailed:
          type: boolean

    EnsembleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']

    Ensemble:
      allOf:
        - $ref: '#/components/schemas/EnsembleInput'
        - type: object
          required: [id, memberCount, workCount, canManage]
          properties:
            id:
              type: string
              format: uuid
            memberCount:
              type: integer
            workCount:
              type: integer
            canManage:
              type: boolean
              description: The user may change members and works.
            logoUrl:
              type: [string, 'null']
              description: Path of the logo image, if any.
            symbol:
              type: [string, 'null']
              description: An emoji shown when there is no logo.
            color:
              type: [string, 'null']
              pattern: '^#[0-9a-fA-F]{6}$'

    PlayedPart:
      type: object
      required: [instrumentId]
      properties:
        instrumentId:
          type: string
          format: uuid
        voice:
          type: [integer, 'null']
          minimum: 1
          description: Null plays every part number of the instrument.

    EnsembleMemberInput:
      type: object
      required: [leader, plays]
      properties:
        leader:
          type: boolean
        plays:
          type: array
          items:
            $ref: '#/components/schemas/PlayedPart'

    EnsembleMember:
      allOf:
        - $ref: '#/components/schemas/EnsembleMemberInput'
        - type: object
          required: [userId, name]
          properties:
            userId:
              type: string
              format: uuid
            name:
              type: string
            avatarUrl:
              type: [string, 'null']

    ProgramInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        date:
          type: [string, 'null']
          format: date
        startTime:
          type: [string, 'null']
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
          description: When the concert starts, HH:MM.
        venue:
          type: [string, 'null']
          maxLength: 200
        notes:
          type: [string, 'null']

    ProgramItem:
      description: A work, or a break such as an interval or a speech.
      oneOf:
        - type: object
          required: [kind, workId]
          properties:
            kind:
              const: work
            workId:
              type: string
              format: uuid
            note:
              type: [string, 'null']
              maxLength: 300
        - type: object
          required: [kind, label]
          properties:
            kind:
              const: break
            label:
              type: string
              minLength: 1
              maxLength: 120
            durationSeconds:
              type: [integer, 'null']
              minimum: 0
              maximum: 86400
            note:
              type: [string, 'null']
              maxLength: 300
      discriminator:
        propertyName: kind

    Program:
      allOf:
        - $ref: '#/components/schemas/ProgramInput'
        - type: object
          required: [id, ensembleId, workIds, items]
          properties:
            id:
              type: string
              format: uuid
            ensembleId:
              type: string
              format: uuid
            workIds:
              type: array
              description: The works in playing order (the works of `items`).
              items:
                type: string
                format: uuid
            items:
              type: array
              description: Works and breaks in playing order.
              items:
                $ref: '#/components/schemas/ProgramItem'

    EnsemblePart:
      type: object
      required: [id, label, workId, workTitle]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        instrumentId:
          type: [string, 'null']
          format: uuid
        voice:
          type: [integer, 'null']
        workId:
          type: string
          format: uuid
        workTitle:
          type: string

    Grant:
      type: object
      required: [partId, userId, label, workTitle, userName]
      properties:
        partId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        label:
          type: string
        workTitle:
          type: string
        userName:
          type: string

    EnsembleWork:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        composer:
          type: [string, 'null']
        arranger:
          type: [string, 'null']
        publisher:
          type: [string, 'null']
        lyricist:
          type: [string, 'null']
        societyNumber:
          type: [string, 'null']
        durationSeconds:
          type: [integer, 'null']

    EnsembleDetail:
      allOf:
        - $ref: '#/components/schemas/Ensemble'
        - type: object
          required: [members, works, programs]
          properties:
            programs:
              type: array
              description: Programmes by date, undated last.
              items:
                $ref: '#/components/schemas/Program'
            members:
              type: array
              items:
                $ref: '#/components/schemas/EnsembleMember'
            works:
              type: array
              items:
                $ref: '#/components/schemas/EnsembleWork'

    Stroke:
      type: object
      required: [tool, color, width, points]
      properties:
        tool:
          type: string
          enum: [pen, highlighter]
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 0.05
          description: Line width as a fraction of the page width.
        points:
          type: array
          minItems: 1
          maxItems: 2000
          description: Points as [x, y], each 0 to 1 – 0,0 is the page's top left, 1,1 its bottom right.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              minimum: 0
              maximum: 1

    AnnotationsInput:
      type: object
      required: [pages]
      properties:
        pages:
          type: object
          description: Strokes by page number ("1", "2", …), in drawing order.
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Stroke'

    Annotations:
      allOf:
        - $ref: '#/components/schemas/AnnotationsInput'
        - type: object
          required: [updatedAt]
          properties:
            updatedAt:
              type: [string, 'null']
              format: date-time

    SharedAnnotations:
      allOf:
        - $ref: '#/components/schemas/AnnotationsInput'
        - type: object
          required: [ensembleId, ensemble, canEdit]
          properties:
            ensembleId:
              type: string
              format: uuid
            ensemble:
              type: string
            updatedAt:
              type: [string, 'null']
              format: date-time
            updatedBy:
              type: [string, 'null']
            canEdit:
              type: boolean
              description: The user may change this layer.

    MyPart:
      type: object
      required: [id, label, pageCount, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        pageCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
          description: Changes whenever the part's PDF is rendered again; offline copies compare it.

    PartInfo:
      allOf:
        - $ref: '#/components/schemas/MyPart'
        - type: object
          required: [workId, workTitle]
          properties:
            workId:
              type: string
              format: uuid
            workTitle:
              type: string
            composer:
              type: [string, 'null']

    MyWork:
      type: object
      required: [id, title, parts]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        composer:
          type: [string, 'null']
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MyPart'

    MyEnsemble:
      type: object
      required: [id, name, leader, works, programs]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        leader:
          type: boolean
        logoUrl:
          type: [string, 'null']
          description: Path of the logo image, if any.
        symbol:
          type: [string, 'null']
          description: An emoji shown when there is no logo.
        color:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
        works:
          type: array
          description: Works of the ensemble with at least one part the user may see.
          items:
            $ref: '#/components/schemas/MyWork'
        programs:
          type: array
          description: Programmes by date, undated last; their works refer to `works`.
          items:
            $ref: '#/components/schemas/Program'
    Instrument:
      type: object
      required: [id, name, familyId, family, aliases, sort, usage]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Klarinette]
        familyId:
          type: string
          format: uuid
        family:
          type: string
          description: Name of the family.
          examples: [Holzbläser]
        transposition:
          type: [string, 'null']
          description: Key the instrument is written in (`Bb`, `Eb`, `F`, …); null for concert pitch.
        aliases:
          type: array
          description: Other names and abbreviations (any language), used to recognise file names and imports.
          items:
            type: string
        sort:
          type: integer
          description: Order within the family.
        usage:
          type: integer
          description: Parts and member assignments that use the instrument; only unused ones can be removed.

    InstrumentInput:
      type: object
      required: [name, familyId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        familyId:
          type: string
          format: uuid
        transposition:
          type: [string, 'null']
          maxLength: 10
        aliases:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 80
        sort:
          type: [integer, 'null']
          description: Order within the family; omitted for new instruments means last.

    InstrumentFamily:
      type: object
      required: [id, name, sort, instrumentCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Blechbläser]
        sort:
          type: integer
        instrumentCount:
          type: integer

    InstrumentFamilyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        sort:
          type: [integer, 'null']
          description: Omitted for new families means last.

    WorkInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        composer:
          type: [string, 'null']
        arranger:
          type: [string, 'null']
        publisher:
          type: [string, 'null']
        lyricist:
          type: [string, 'null']
        societyNumber:
          type: [string, 'null']
          description: The performing rights society's number of the work (e.g. GEMA-Werknummer).
        archiveLocation:
          type: [string, 'null']
          description: Where the printed copies are kept, e.g. "Schrank 3, Fach B".
        instrumentation:
          type: [string, 'null']
          description: Free text, e.g. "Symphonic band" or "SATB".
        difficulty:
          type: [integer, 'null']
          minimum: 1
          maximum: 6
        durationSeconds:
          type: [integer, 'null']
          minimum: 0
        source:
          type: [string, 'null']
          description: Where the music comes from or under which licence it is used (free text, for the operator).
        notes:
          type: [string, 'null']
        tags:
          type: array
          items:
            type: string
          default: []

    Work:
      allOf:
        - $ref: '#/components/schemas/WorkInput'
        - type: object
          required: [id, tags, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    RecognitionAbilities:
      type: object
      required: [text, ocr, ai]
      description: How this server reads sheet music.
      properties:
        text:
          type: boolean
          description: Text in digital PDFs.
        ocr:
          type: boolean
          description: Text in scans.
        ai:
          type: boolean
          description: An external AI reads the page as well (also clef, key and time signature).

    Recognition:
      type: object
      required: [method, ai]
      properties:
        method:
          type: string
          enum: [text, ocr, none]
          description: Where the text came from.
        ai:
          type: boolean
          description: The external AI contributed.
        title:
          type: [string, 'null']
        subtitle:
          type: [string, 'null']
        composer:
          type: [string, 'null']
        arranger:
          type: [string, 'null']
        lyricist:
          type: [string, 'null']
        publisher:
          type: [string, 'null']
        part:
          type: [string, 'null']
          description: The part as printed, e.g. "2. Trompete in B".
        instrumentId:
          type: [string, 'null']
          format: uuid
        voice:
          type: [integer, 'null']
        clef:
          type: [string, 'null']
          description: At the beginning of the first staff (AI only).
        key:
          type: [string, 'null']
          description: Key signature as written for the part (AI only).
        timeSignature:
          type: [string, 'null']

    PartProposal:
      type: object
      required: [score, pages]
      properties:
        printed:
          type: [string, 'null']
          description: The header as printed on the part's first page; null for pages before the first header.
        instrumentId:
          type: [string, 'null']
          format: uuid
        voice:
          type: [integer, 'null']
        score:
          type: boolean
          description: A score or conductor's part rather than one instrument.
        pages:
          type: array
          items:
            type: integer

    LoanInput:
      type: object
      required: [item]
      properties:
        item:
          type: string
          minLength: 1
          maxLength: 120
          description: What was lent, e.g. "Trompete 2" or "complete set".
        quantity:
          type: [integer, 'null']
          minimum: 1
          maximum: 999
        borrowerId:
          type: [string, 'null']
          format: uuid
          description: A person of the organisation; their name is taken from the account.
        borrowerName:
          type: [string, 'null']
          maxLength: 120
          description: Someone without an account (used when borrowerId is null).
        lentOn:
          type: [string, 'null']
          format: date
          description: Today when omitted.
        dueOn:
          type: [string, 'null']
          format: date
        returnedOn:
          type: [string, 'null']
          format: date
        note:
          type: [string, 'null']

    Loan:
      type: object
      required: [id, workId, workTitle, item, quantity, borrowerName, lentOn]
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        workTitle:
          type: string
        item:
          type: string
        quantity:
          type: integer
        borrowerId:
          type: [string, 'null']
          format: uuid
        borrowerName:
          type: string
        lentOn:
          type: string
          format: date
        dueOn:
          type: [string, 'null']
          format: date
        returnedOn:
          type: [string, 'null']
          format: date
        note:
          type: [string, 'null']

    Borrower:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    System:
      type: object
      required: [version, publicUrl, language, storage, maxUploadBytes, recognition, counts, checklist]
      properties:
        version:
          type: string
        publicUrl:
          type: string
        language:
          type: string
          enum: [en, de]
        storage:
          type: string
          description: s3 or fs.
        maxUploadBytes:
          type: integer
        mailFrom:
          type: [string, 'null']
          description: The sender; null when the server sends no email.
        recognition:
          $ref: '#/components/schemas/RecognitionAbilities'
        ai:
          type: [string, 'null']
          description: The external AI reading pages, if any.
        sso:
          type: [string, 'null']
        counts:
          type: object
          required: [people, ensembles, works, parts, recordings, storedBytes]
          properties:
            people:
              type: integer
            ensembles:
              type: integer
            works:
              type: integer
            parts:
              type: integer
            recordings:
              type: integer
            storedBytes:
              type: integer
              description: Sources, recordings and images.
        checklist:
          type: array
          items:
            type: object
            required: [key, done, optional, manual]
            properties:
              key:
                type: string
                enum: [logo, instruments, ensembles, people, music, mail, testMail, sso, backups]
              done:
                type: boolean
              optional:
                type: boolean
              manual:
                type: boolean
                description: Ticked by hand rather than recognised.

    Organization:
      type: object
      required: [id, name, profilePictures]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: [string, 'null']
        profilePictures:
          type: boolean

    RecordingInput:
      type: object
      required: [kind, origin, title]
      properties:
        kind:
          type: string
          enum: [full, practice]
          description: A recording of the whole work, or a practice recording of one part or voice.
        origin:
          type: string
          enum: [recorded, generated]
          description: Played and recorded, or generated (e.g. from MIDI or notation software).
        title:
          type: string
          minLength: 1
          maxLength: 120
        partId:
          type: [string, 'null']
          format: uuid
          description: Practice recordings only.
        instrumentId:
          type: [string, 'null']
          format: uuid
          description: Practice recordings only, e.g. the voice "Sopran" when all voices share one score.
        voice:
          type: [integer, 'null']
          minimum: 1
        durationSeconds:
          type: [number, 'null']
          description: Measured by the uploading browser.

    Recording:
      allOf:
        - $ref: '#/components/schemas/RecordingInput'
        - type: object
          required: [id, workId, fileName, contentType, size, createdAt]
          properties:
            id:
              type: string
              format: uuid
            workId:
              type: string
              format: uuid
            fileName:
              type: string
            contentType:
              type: string
            size:
              type: integer
            createdAt:
              type: string
              format: date-time

    GuestLink:
      type: object
      required: [id, name, partIds, expiresOn, revoked]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        partIds:
          type: array
          items:
            type: string
            format: uuid
        expiresOn:
          type: string
          format: date
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        revoked:
          type: boolean
        createdBy:
          type: [string, 'null']
        url:
          type: string
          description: Only in the answer to creating it.

    GuestView:
      type: object
      required: [name, ensemble, expiresOn, parts]
      properties:
        name:
          type: string
        ensemble:
          type: string
        expiresOn:
          type: string
          format: date
        parts:
          type: array
          items:
            type: object
            required: [id, label, workTitle, pageCount]
            properties:
              id:
                type: string
                format: uuid
              label:
                type: string
              workTitle:
                type: string
              composer:
                type: [string, 'null']
              pageCount:
                type: integer

    NotificationKind:
      type: string
      enum: [partsNew, programChanged, loanDue, annotationsShared, guestLinkExpiring]

    Notification:
      type: object
      required: [id, kind, params, createdAt, read]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/NotificationKind'
        params:
          type: object
          description: >-
            What the text is made of, by kind – partsNew: work, part (missing when a whole work was given);
            programChanged: program, ensemble; loanDue: work, item, date, overdue; annotationsShared: by, part, work;
            guestLinkExpiring: guest, date.
          additionalProperties: true
        link:
          type: [string, 'null']
          description: A path of the web app.
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean

    Inbox:
      type: object
      required: [unread, items]
      properties:
        unread:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

    NotificationSetting:
      type: object
      required: [kind, inApp, email, push]
      properties:
        kind:
          $ref: '#/components/schemas/NotificationKind'
        inApp:
          type: boolean
        email:
          type: boolean
        push:
          type: boolean
          description: Kept already; push messages are not sent yet.

    PersonalData:
      type: object
      description: >-
        A self-describing export (account, ensembles, singleParts, annotations, loans, signIns); its fields may grow.
      required: [exportedAt, account]
      properties:
        exportedAt:
          type: string
          format: date-time
        account:
          type: object
      additionalProperties: true

    Deletion:
      type: object
      required: [userId, deletedAt, records]
      properties:
        userId:
          type: string
          format: uuid
          description: Id of the deleted account (nothing else about the person is kept).
        deletedBy:
          type: [string, 'null']
          description: Name of the admin who deleted it, while that account exists.
        deletedAt:
          type: string
          format: date-time
        records:
          type: object
          description: How many records went with the account, by kind.
          additionalProperties:
            type: integer

    WorkFacets:
      type: object
      required: [composers, arrangers, publishers, instrumentations, tags]
      properties:
        composers:
          type: array
          items:
            type: string
        arrangers:
          type: array
          items:
            type: string
        publishers:
          type: array
          items:
            type: string
        instrumentations:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string

    WorkSummary:
      allOf:
        - $ref: '#/components/schemas/Work'
        - type: object
          required: [sourceCount, partCount]
          properties:
            sourceCount:
              type: integer
            partCount:
              type: integer

    WorkDetail:
      allOf:
        - $ref: '#/components/schemas/Work'
        - type: object
          required: [sources, parts]
          properties:
            sources:
              type: array
              items:
                $ref: '#/components/schemas/SourceFile'
            parts:
              type: array
              items:
                $ref: '#/components/schemas/Part'

    SourceFile:
      type: object
      required: [id, workId, fileName, size, sha256, pageCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workId:
          type: string
          format: uuid
        fileName:
          type: string
        size:
          type: integer
          description: Bytes.
        sha256:
          type: string
        pageCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    PartInput:
      type: object
      required: [label, sourceId, pages]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
          description: Display name, e.g. "Clarinet 2" or "Full score".
        instrumentId:
          type: [string, 'null']
          format: uuid
          description: Null for parts without a single instrument (full score, choir).
        voice:
          type: [integer, 'null']
          minimum: 1
          description: Part number for instruments with several parts (Clarinet 1, 2, 3).
        sourceId:
          type: string
          format: uuid
          description: A source file of the same work.
        pages:
          type: array
          minItems: 1
          description: 1-based page numbers of the source file in the order the part shows them; each page at most once.
          items:
            type: integer
            minimum: 1

    Part:
      allOf:
        - $ref: '#/components/schemas/PartInput'
        - type: object
          required: [id, workId, pageCount, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            workId:
              type: string
              format: uuid
            pageCount:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
