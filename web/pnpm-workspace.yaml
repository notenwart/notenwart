# pnpm's settings for the web app: exact versions when adding one, and none younger than 14 days (in minutes). A fix
# for a security advisory may be let through by name with minimumReleaseAgeExclude.
savePrefix: ''
minimumReleaseAge: 20160
allowBuilds:
  esbuild: true
