<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#F5EFE3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121A2B" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			// The chosen colour mode before the first paint, so nothing flashes (see lib/theme.svelte.ts).
			try {
				var mode = localStorage.getItem('notenwart.theme');
				if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
