# SPDX-License-Identifier: AGPL-3.0-or-later
# Checks on every push and pull request: the web app (lint, types, tests, build, its API types up to date with
# the API description); the Rust workspace on Linux and macOS with the web build embedded (format, lints, tests
# against PostgreSQL, migrations); dependencies (cargo deny). The licence check
# (REUSE) and a sign-off (DCO) on every commit of a pull request come from falkoss/starterpack, pinned by commit.
# Actions are pinned by commit, with the version as a comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  web:
    name: Web app – lint, check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir web install --frozen-lockfile
      - name: API types match the API description
        run: pnpm --dir web api:types && git diff --exit-code web/src/lib/api
      - run: pnpm --dir web lint
      - run: pnpm --dir web check
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist

  rust:
    name: Rust – fmt, clippy, test (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: postgres://notenwart:notenwart@127.0.0.1:5432/notenwart
      # Compile against the committed .sqlx query data; the tests then run against the live database.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # PostgreSQL and the tools for reading sheet music (pdftotext, pdftoppm, tesseract). Service containers only run
      # on Linux, so macOS gets PostgreSQL from Homebrew.
      - name: PostgreSQL and tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          docker run -d --name db -p 127.0.0.1:5432:5432 -e POSTGRES_USER=notenwart -e POSTGRES_PASSWORD=notenwart \
            -e POSTGRES_DB=notenwart postgres:17
          until docker exec db pg_isready -U notenwart; do sleep 1; done
      - name: PostgreSQL and tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@17 poppler tesseract tesseract-lang
          brew services start postgresql@17
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          until pg_isready -h 127.0.0.1; do sleep 1; done
          psql -h 127.0.0.1 -d postgres -c "CREATE ROLE notenwart LOGIN SUPERUSER PASSWORD 'notenwart'"
          createdb -h 127.0.0.1 -O notenwart notenwart
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - name: Migrations apply
        run: cargo run --locked -q -p notenwart -- migrate

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
