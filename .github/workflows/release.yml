# SPDX-License-Identifier: AGPL-3.0-or-later
# Release on a version tag (v0.1.0 …): checks the tag against Cargo.toml, publishes the container image to the
# GitHub Container Registry (ghcr.io/notenwart/notenwart:<version> and :latest) and creates a GitHub release with
# the version's section of CHANGELOG.md. linux/amd64 only for now (arm64: OPEN). Actions are pinned by commit, with
# the version as a comment.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version from the tag matches Cargo.toml and the changelog
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$want" = "$have" ] || { echo "::error::Tag $GITHUB_REF_NAME but Cargo.toml says $have"; exit 1; }
          awk -v v="$want" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no section [$want]"; exit 1; }
          echo "VERSION=$want" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/notenwart/notenwart:${{ env.VERSION }}
            ghcr.io/notenwart/notenwart:latest
          labels: |
            org.opencontainers.image.title=notenwart
            org.opencontainers.image.description=Self-hosted sheet music library for music schools, orchestras and bands
            org.opencontainers.image.source=https://github.com/notenwart/notenwart
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "notenwart $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
